name: Reader
options:
  bundleIdPrefix: no.sandertonning
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: nb

packages:
  ReaderKit:
    path: Packages/ReaderKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Sett ditt eget team lokalt i Xcode (gratis Apple-ID holder).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Reader:
    type: application
    platform: [iOS, macOS]
    sources:
      - path: App
        excludes:
          - "macOS/**"
    dependencies:
      - package: ReaderKit
    info:
      path: Generated/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.books
        CFBundleURLTypes:
          - CFBundleURLName: no.sandertonning.reader
            CFBundleURLSchemes: [reader]
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: PDF
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Lyd
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.sandertonning.reader
        PRODUCT_NAME: Reader
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/macOS/Reader.entitlements
    scheme:
      testTargets: []
